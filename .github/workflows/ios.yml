name: Build the iPhone app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test the engine
        working-directory: FEGlobe
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+\([0-9A-F-]{36}\)' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -scheme FEGlobe -destination "platform=iOS Simulator,id=$DEVICE"
      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Build without signing
        run: |
          xcodebuild -project Atlas.xcodeproj -scheme Atlas -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Pack the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Atlas.app Payload/
          zip -qr Atlas.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-unsigned
          path: Atlas.ipa
