name: Atlas
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  ArcGIS:
    url: https://github.com/Esri/arcgis-maps-sdk-swift
    exactVersion: 200.8.3 # the licence string is tied to the major version of the SDK
targets:
  Atlas:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: ArcGIS
        product: ArcGIS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Shows where you are on the globe.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.flowsearch.atlas
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
