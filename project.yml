name: Atlas
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  FEGlobe:
    path: FEGlobe
targets:
  Atlas:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: FEGlobe
        product: FEGlobe
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Shows where you are on the globe.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.flowsearch.atlas
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
